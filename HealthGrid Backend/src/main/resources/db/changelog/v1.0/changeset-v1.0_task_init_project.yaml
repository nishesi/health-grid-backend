databaseChangeLog:
  - changeSet:
      id: 1
      author: Nurislam Zaripov
      changes:
        - createTable:
            tableName: health_indicator
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: value
                  type: NUMERIC(10, 2)
              - column:
                  name: status
                  type: VARCHAR(50)
